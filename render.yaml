services:
  - type: web
    name: proxy-backend
    env: java
    plan: free
    buildCommand: "./mvnw clean package -DskipTests"
    startCommand: "java -Xmx256m -jar target/proxy-backend-1.0.0.jar"
    envVars:
      - key: PORT
        value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://proxy-frontend.vercel.app"
    healthCheckPath: /actuator/health