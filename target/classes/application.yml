server:
  port: ${PORT:8080}

spring:
  application:
    name: proxy-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://proxy-frontend.vercel.app}

logging:
  level:
    com.example.proxy: DEBUG
    org.springframework.web: INFO